<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b13" />
    <title>Soma Digital Community | Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090b13; color: #f7f8fb; }
      main { width: min(420px, calc(100% - 40px)); padding: 32px; border: 1px solid rgba(255,255,255,.1); border-radius: 18px; background: #111827; box-sizing: border-box; text-align: center; }
      img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 20px; }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0; color: #a8b0c0; line-height: 1.6; }
      button { margin-top: 24px; border: 0; border-radius: 10px; padding: 11px 18px; background: #2563eb; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192x192.png" alt="Soma Digital Community" />
      <h1>You are offline</h1>
      <p>Reconnect to continue using Soma Digital Community. Your saved work is still on this device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
